name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      # Restore the release keystore from GitHub Secrets so CI-built APKs
      # share the same signature as local builds (overwrite-install works).
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/zemote-release.jks
            echo "ANDROID_STOREFILE=zemote-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_STOREPASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEYPASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "Release signing configured from secrets."
          else
            echo "WARN: ANDROID_KEYSTORE_BASE64 secret missing; APK will use debug signing."
          fi

      - name: Build ABI APKs (release)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zemote-arm64-v8a.apk
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zemote-armeabi-v7a.apk
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zemote-x86_64.apk

      - name: Generate ABI checksums
        run: |
          cd build/app/outputs/flutter-apk
          md5sum zemote-arm64-v8a.apk > zemote-arm64-v8a.apk.md5
          md5sum zemote-armeabi-v7a.apk > zemote-armeabi-v7a.apk.md5
          md5sum zemote-x86_64.apk > zemote-x86_64.apk.md5

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: .github/scripts/release-notes.ps1

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            build/app/outputs/flutter-apk/zemote-arm64-v8a.apk
            build/app/outputs/flutter-apk/zemote-arm64-v8a.apk.md5
            build/app/outputs/flutter-apk/zemote-armeabi-v7a.apk
            build/app/outputs/flutter-apk/zemote-armeabi-v7a.apk.md5
            build/app/outputs/flutter-apk/zemote-x86_64.apk
            build/app/outputs/flutter-apk/zemote-x86_64.apk.md5
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
